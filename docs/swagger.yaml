basePath: /
definitions:
  auth.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  auth.LoginDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.TokenResponseDTO:
    properties:
      access_token:
        type: string
    type: object
  order.CreateOrderDTO:
    properties:
      code:
        minLength: 1
        type: string
      converted_at:
        type: string
      order_services:
        items:
          $ref: '#/definitions/order.OrderServiceInput'
        type: array
      sent_at:
        type: string
      subject:
        minLength: 1
        type: string
      title:
        type: string
    required:
    - title
    type: object
  order.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  order.OrderServiceInput:
    properties:
      id:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  order.OrderServiceResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  order.ResponseDTO:
    properties:
      code:
        type: string
      converted_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      order_services:
        items:
          $ref: '#/definitions/order.OrderServiceResponse'
        type: array
      sent_at:
        type: string
      subject:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  order.UpdateOrderDTO:
    properties:
      code:
        minLength: 1
        type: string
      converted_at:
        type: string
      order_services:
        items:
          $ref: '#/definitions/order.OrderServiceInput'
        type: array
      removed_service_ids:
        items:
          type: string
        type: array
      sent_at:
        type: string
      subject:
        minLength: 1
        type: string
      title:
        minLength: 1
        type: string
    type: object
  user.CreateDTO:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  user.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  user.ResponseDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API HTTP do template. Em produção, ajuste o host conforme o deployment.
  title: go-api-template API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica credenciais e retorna JWT.
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: Login
      tags:
      - auth
  /orders:
    post:
      consumes:
      - application/json
      description: Cria um pedido com serviços aninhados.
      parameters:
      - description: Dados do pedido
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/order.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/order.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/order.ErrorResponse'
      summary: Criar pedido
      tags:
      - orders
  /orders/{id}:
    get:
      description: Retorna um pedido por ID com seus serviços.
      parameters:
      - description: UUID do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/order.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/order.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/order.ErrorResponse'
      summary: Buscar pedido
      tags:
      - orders
    patch:
      consumes:
      - application/json
      description: 'Atualização parcial: título opcional; itens em `order_services`
        com `id` são UPDATE, sem `id` são INSERT; `removed_service_ids` deleta na
        mesma transação. Itens omitidos permanecem inalterados.'
      parameters:
      - description: UUID do pedido
        in: path
        name: id
        required: true
        type: string
      - description: Patch do pedido
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.UpdateOrderDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/order.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/order.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/order.ErrorResponse'
      summary: Atualizar pedido (parcial)
      tags:
      - orders
  /users:
    post:
      consumes:
      - application/json
      description: Registra um novo usuário.
      parameters:
      - description: Dados do usuário
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.CreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      summary: Criar usuário
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      description: Retorna o perfil do usuário do token JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/user.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/user.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Usuário autenticado
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Digite "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
