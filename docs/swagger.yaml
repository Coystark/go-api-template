basePath: /
definitions:
  auth.LoginDTO:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.TokenResponseDTO:
    properties:
      access_token:
        type: string
    type: object
  httperr.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  order.CreateOrderDTO:
    properties:
      code:
        minLength: 1
        type: string
      converted_at:
        type: string
      order_services:
        items:
          $ref: '#/definitions/order.OrderServiceInput'
        type: array
      sent_at:
        type: string
      subject:
        minLength: 1
        type: string
      title:
        type: string
    required:
    - title
    type: object
  order.ListOrderServicesResponseDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/order.OrderServiceResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  order.ListResponseDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/order.ResponseDTO'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  order.OrderServiceInput:
    properties:
      end_date:
        type: string
      id:
        type: string
      observations:
        minLength: 1
        type: string
      start_date:
        type: string
      title:
        type: string
    required:
    - start_date
    - title
    type: object
  order.OrderServiceResponse:
    properties:
      created_at:
        type: string
      end_date:
        type: string
      id:
        type: string
      observations:
        type: string
      order_id:
        type: string
      start_date:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  order.ResponseDTO:
    properties:
      code:
        type: string
      converted_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      order_services:
        items:
          $ref: '#/definitions/order.OrderServiceResponse'
        type: array
      sent_at:
        type: string
      subject:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  order.UpdateOrderDTO:
    properties:
      code:
        minLength: 1
        type: string
      converted_at:
        type: string
      order_services:
        items:
          $ref: '#/definitions/order.OrderServiceInput'
        type: array
      removed_service_ids:
        items:
          type: string
        type: array
      sent_at:
        type: string
      subject:
        minLength: 1
        type: string
      title:
        minLength: 1
        type: string
    required:
    - title
    type: object
  user.CreateDTO:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  user.ResponseDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API HTTP do template. Em produção, ajuste o host conforme o deployment.
  title: go-api-template API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica credenciais e retorna JWT.
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      summary: Login
      tags:
      - auth
  /order-services:
    get:
      description: Retorna linhas de order_services com paginação. Filtro opcional
        `order_id` restringe ao pedido. Apenas serviços de pedidos não removidos (soft
        delete).
      parameters:
      - default: 1
        description: Página, começando em 1
        in: query
        name: page
        type: integer
      - default: 20
        description: Itens por página, máximo 100
        in: query
        name: page_size
        type: integer
      - description: UUID v7 do pedido (filtro opcional)
        in: query
        name: order_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.ListOrderServicesResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar serviços de pedidos
      tags:
      - order-services
  /orders:
    get:
      description: Retorna pedidos resumidos com paginação.
      parameters:
      - default: 1
        description: Página, começando em 1
        in: query
        name: page
        type: integer
      - default: 20
        description: Itens por página, máximo 100
        in: query
        name: page_size
        type: integer
      - description: Filtro parcial case-insensitive em `code` (ILIKE)
        in: query
        name: code
        type: string
      - description: Filtro parcial case-insensitive em `title` (ILIKE)
        in: query
        name: title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.ListResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar pedidos
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Cria um pedido com serviços aninhados.
      parameters:
      - description: Dados do pedido
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.CreateOrderDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/order.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Criar pedido
      tags:
      - orders
  /orders/{id}:
    delete:
      description: Remove logicamente um pedido.
      parameters:
      - description: UUID v7 do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remover pedido
      tags:
      - orders
    get:
      description: Retorna um pedido por ID com seus serviços.
      parameters:
      - description: UUID v7 do pedido
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buscar pedido
      tags:
      - orders
    put:
      consumes:
      - application/json
      description: 'Replace total do cabeçalho: `title` obrigatório; `subject`, `code`,
        `sent_at` e `converted_at` omitidos ou `null` gravam NULL (reenvie para manter).
        Em `order_services`, linhas com `id` são UPDATE (sem `id` são INSERT); linhas
        não enviadas permanecem; `removed_service_ids` remove na mesma transação.
        Em UPDATE de linha, `end_date` e `observations` omitidos ou `null` gravam
        NULL — reenvie para mantê-los.'
      parameters:
      - description: UUID v7 do pedido
        in: path
        name: id
        required: true
        type: string
      - description: Corpo do pedido
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/order.UpdateOrderDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/order.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Atualizar pedido
      tags:
      - orders
  /users:
    post:
      consumes:
      - application/json
      description: Registra um novo usuário.
      parameters:
      - description: Dados do usuário
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.CreateDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/user.ResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      summary: Criar usuário
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      description: Retorna o perfil do usuário do token JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.ResponseDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httperr.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Usuário autenticado
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Digite "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
