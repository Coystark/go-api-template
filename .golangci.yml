run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gosec
    - bodyclose
    - sqlclosecheck
    - errorlint

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning

issues:
  exclude-use-default: false
